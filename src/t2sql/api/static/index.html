<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>t2sql playground</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1f; --muted: #6b6b70; --line: #e4e4e0;
    --accent: #2f5bd3; --ok: #1f7a4d; --bad: #b3261e; --code-bg: #f2f2ef;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151517; --panel: #1e1e21; --text: #ececee; --muted: #9a9aa2; --line: #2e2e33;
            --accent: #7c9cff; --ok: #5cc98f; --bad: #ff7b72; --code-bg: #26262b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 28px 16px 60px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  form { display: grid; grid-template-columns: 180px 1fr auto; gap: 8px; }
  select, textarea, button { font: inherit; color: var(--text); background: var(--panel);
                             border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; }
  textarea { resize: vertical; min-height: 42px; }
  button { background: var(--accent); color: #fff; border: none; cursor: pointer; padding: 9px 18px; }
  button:disabled { opacity: .6; cursor: wait; }
  .evidence { grid-column: 2 / 4; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
            padding: 14px 16px; margin-top: 16px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
       margin: 0 0 8px; }
  pre { margin: 0; background: var(--code-bg); padding: 10px 12px; border-radius: 8px;
        overflow-x: auto; font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .meta { display: flex; flex-wrap: wrap; gap: 18px; color: var(--muted); font-size: 14px; }
  .meta b { color: var(--text); }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  .cand { border-top: 1px solid var(--line); padding: 8px 0; }
  .cand:first-of-type { border-top: none; }
  .hint { display: inline-block; background: var(--code-bg); border-radius: 6px; padding: 2px 8px;
          margin: 2px 4px 2px 0; font: 12px ui-monospace, Menlo, monospace; }
  .err { color: var(--bad); }
  @media (max-width: 640px) { form { grid-template-columns: 1fr; } .evidence { grid-column: auto; } }
</style>
</head>
<body>
<main>
  <h1>t2sql playground</h1>
  <p class="sub">Ask a question about a database. The answer comes with the SQL, the rows, and how many
    candidate queries agreed on it.</p>
  <form id="f">
    <select id="db" aria-label="Database"></select>
    <textarea id="q" rows="2" placeholder="e.g. Which instructors teach in the Stata Center?" required></textarea>
    <button id="go" type="submit">Ask</button>
    <textarea id="ev" class="evidence" rows="1" placeholder="Optional hint (a definition, e.g. 'full-time means credits >= 12')"></textarea>
  </form>
  <div id="out"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function loadDbs() {
  const r = await fetch("/v1/databases");
  const { databases } = await r.json();
  $("db").innerHTML = databases.map((d) => `<option>${esc(d)}</option>`).join("");
}

function table(result) {
  if (!result) return "";
  const head = result.columns.map((c) => `<th>${esc(c)}</th>`).join("");
  const rows = result.rows.slice(0, 200).map((r) => `<tr>${r.map((v) => `<td>${esc(v)}</td>`).join("")}</tr>`).join("");
  const more = result.truncated ? `<p class="sub">Showing the first ${result.rows.length} rows.</p>` : "";
  return `<section><h2>Result · ${result.rows.length} row(s) · ${result.elapsed_ms} ms</h2>
    <div class="table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>${more}</section>`;
}

function render(d) {
  const pct = Math.round(d.confidence * 100);
  const cands = d.candidates.map((c, i) => `<div class="cand">
      <span class="${c.ok ? "ok" : "bad"}">${c.ok ? "✓" : "✗"}</span> candidate ${i + 1}
      ${i === 0 ? "(greedy)" : ""} · ${c.rows} row(s)${c.repairs ? ` · repaired ×${c.repairs}` : ""}
      ${c.error ? `<span class="err"> · ${esc(c.error)}</span>` : ""}
      <pre>${esc(c.sql)}</pre></div>`).join("");
  const hints = d.value_hints.length
    ? d.value_hints.map((h) => `<span class="hint">${esc(h)}</span>`).join("")
    : '<span class="sub">none</span>';
  $("out").innerHTML = `
    <section><h2>SQL</h2><pre>${esc(d.sql || "(no query)")}</pre>
      <div class="meta" style="margin-top:10px">
        <span>agreement <b>${pct}%</b></span><span>LLM calls <b>${d.llm_calls}</b></span>
        <span>time <b>${(d.elapsed_ms / 1000).toFixed(1)} s</b></span><span>request <b>${esc(d.request_id)}</b></span>
      </div>${d.error ? `<p class="err">${esc(d.error)}</p>` : ""}</section>
    ${table(d.result)}
    <section><h2>Values found in the database</h2>${hints}</section>
    <section><h2>Candidates</h2>${cands}</section>`;
}

$("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("go").disabled = true; $("go").textContent = "Thinking…";
  $("out").innerHTML = "";
  try {
    const r = await fetch("/v1/query", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ db: $("db").value, question: $("q").value, evidence: $("ev").value || null }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || r.statusText);
    render(d);
  } catch (err) {
    $("out").innerHTML = `<section class="err">${esc(err.message)}</section>`;
  } finally {
    $("go").disabled = false; $("go").textContent = "Ask";
  }
});
loadDbs();
</script>
</body>
</html>
