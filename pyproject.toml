[project]
name = "t2sql"
version = "2.0.0"
description = "Schema-agnostic Text-to-SQL service with value-aware schema linking, execution-guided self-consistency and a defence-in-depth SQL sandbox."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlglot>=25.0",
    "httpx>=0.27",
    "rapidfuzz>=3.9",
    "typer>=0.12",
]

[project.optional-dependencies]
embeddings = ["fastembed>=0.3", "numpy>=1.26"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
t2sql = "t2sql.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/t2sql"]
artifacts = ["src/t2sql/api/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501"]  # typer defaults; long strings are left to the formatter
